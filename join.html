      <h1>FEUTURE ARTS</h1>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>

  <main>
    <h2 class="page-title">Committee and Membership Application</h2>
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <a href="https://forms.gle/ah76HRVBhhtvSTgXA" target="_blank" style="color: var(--secondary-orange); font-weight: bold; text-decoration: underline;">Open Google Form Application Directly</a>
    </div>
    <div class="form-container">
      <form action="#" method="POST">
        <div class="form-group">
          <label for="fname">First Name</label>
          <input type="text" id="fname" name="firstname" required>
        </div>
        <div class="form-group">
          <label for="lname">Last Name</label>
          <input type="text" id="lname" name="lastname" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
          <label for="studentid">Student ID</label>
          <input type="text" id="studentid" name="studentid" required>
        </div>
        <div class="form-group">
          <label for="committee">Preferred Committee</label>
          <select id="committee" name="committee">
            <option value="creatives">Creatives</option>
            <option value="media">Media</option>
            <option value="publicity">Publicity & Marketing</option>
            <option value="events">Special Events</option>
          </select>
        </div>
        <button type="submit" class="submit-btn">Submit</button>
      </form>
    </div>
  </main>

  <footer>
    <p>feuturearts@gmail.com | Feuture Arts - FEU Alabang</p>
  </footer>
</body>
</html>
